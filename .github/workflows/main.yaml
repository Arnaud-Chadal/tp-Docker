name: CI devops 2025
on:
  #to begin you want to launch this job in main and develop
  push:
    branches: main
  pull_request:
  workflow_dispatch:

jobs:
  test-backend: 
    runs-on: ubuntu-24.04
    steps:
     #checkout your github code using actions/checkout@v4
      - uses: actions/checkout@v4

     #do the same with another action (actions/setup-java@v4) that enable to setup jdk 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

     #finally build your app with the latest command
      - name: Build and test with Maven
        run: mvn clean verify --file tp1/java/simpleapi/pom.xml

      # - name: Sonar
      #   run: mvn -B verify sonar:sonar -Dsonar.projectKey=Arnaud-Chadal_tp-Docker -Dsonar.organization=arnaud-chadal -Dsonar.host.url=https://sonarcloud.io -Dsonar.login=${{ secrets.SONAR_TOKN }}  --file tp1/java/simpleapi/pom.xml


  # define job to build and publish docker image
  build-and-push-docker-image:
    needs: test-backend
    # run only when code is compiling and tests are passing
    runs-on: ubuntu-24.04

    # steps to perform in job
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin


      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          # relative path to the place where source code with Dockerfile is located
          context: tp1/java/simpleapi
          # Note: tags has to be all lower-case
          tags:  chadalarnaud/tp-devops-simple-api:latest
          push: ${{ github.ref == 'refs/heads/main' }}


      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          # relative path to the place where source code with Dockerfile is located
          context: tp1/database
          # Note: tags has to be all lower-case
          tags:  chadalarnaud/tp-devops-database:latest
          push: ${{ github.ref == 'refs/heads/main' }}


      - name: Build image and push web
        uses: docker/build-push-action@v6
        with:
          # relative path to the place where source code with Dockerfile is located
          context: tp1/HTML
          # Note: tags has to be all lower-case
          tags:  chadalarnaud/tp-devops-httpd:latest
          push: ${{ github.ref == 'refs/heads/main' }}


  deploy-app:
    needs: build-and-push-docker-image
    # run only when code is compiling and tests are passing
    runs-on: ubuntu-24.04

    # steps to perform in job
    steps:
      - uses: actions/checkout@v4
      - name: install ansible
        runs: |
          sudo apt-get update
          sudo apt-get install -y ansible
      - name: create ssh key
        run: |
          echo "${{secrets.SSH_KEY}} > id_rsa"
          chmod 400 id_rsa
      - name: run playbook
        runs: ansible-playbook ../tp1/ansible/dockerPlaybook.yml
      