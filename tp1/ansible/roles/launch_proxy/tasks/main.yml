---
- name: Log in to GHCR
  community.docker.docker_login:
    registry_url: ghcr.io
    username: "{{ ghcr_user }}"
    password: "{{ ghcr_token }}"
  vars:
    ansible_python_interpreter: /opt/docker_venv/bin/python

- name: Run Proxy / Frontend HTML container
  community.docker.docker_container:
    name: proxy
    image: "docker.io/chadalarnaud/tp-devops-httpd:latest"
    state: started
    restart_policy: always
    published_ports:
      - "80:80"
    networks:
      - name: app_network
  vars:
    ansible_python_interpreter: /opt/docker_venv/bin/python